name: Chollo Radar Bootstrap

on:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - "index.html"
      - "sitemap.xml"
      - "styles.css"
      - ".github/workflows/bootstrap-content.yml"
  pull_request:
    paths:
      - "bot/**"
      - "index.html"
      - "sitemap.xml"
      - "styles.css"
      - ".github/workflows/bootstrap-content.yml"
  schedule:
    - cron: "12 8,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chollo-radar-bootstrap
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/pyproject.toml
      - name: Instalar
        run: python -m pip install --disable-pip-version-check .
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Previsualizar la campaña sin publicar
        env:
          DRY_RUN: "true"
          DATABASE_PATH: "${{ runner.temp }}/chollo-radar-bootstrap.db"
        run: |
          cp config.example.json config.json
          chollo-radar bootstrap --site-root .. --skip-telegram

  campaign:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.CHOLLO_RADAR_BOOTSTRAP_ENABLED != 'false'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chollo-radar-production
    permissions:
      contents: write
    defaults:
      run:
        working-directory: bot
    env:
      DRY_RUN: "${{ vars.CHOLLO_RADAR_BOOTSTRAP_DRY_RUN || 'false' }}"
      SUPABASE_URL: "https://jokkwdhlvbkwegcuezyi.supabase.co"
      SUPABASE_SECRET_KEY: "${{ secrets.SUPABASE_SECRET_KEY }}"
      TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
      TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
      X_API_KEY: "${{ secrets.X_API_KEY }}"
      X_API_SECRET: "${{ secrets.X_API_SECRET }}"
      X_ACCESS_TOKEN: "${{ secrets.X_ACCESS_TOKEN }}"
      X_ACCESS_TOKEN_SECRET: "${{ secrets.X_ACCESS_TOKEN_SECRET }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/pyproject.toml
      - name: Instalar
        run: python -m pip install --disable-pip-version-check .
      - name: Ejecutar campaña
        run: |
          cp config.example.json config.json
          chollo-radar bootstrap --site-root ..
      - name: Publicar el nuevo artículo en la web
        if: env.DRY_RUN == 'false'
        working-directory: .
        run: |
          git config user.name "chollo-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- .chollo-radar-campaign.json articulos index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No hay un artículo nuevo que publicar."
          else
            git commit -m "Publicar nueva guía de Chollo Radar"
            git push origin HEAD:main
          fi
