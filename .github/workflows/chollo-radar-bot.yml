name: Chollo Radar Bot

on:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - ".github/workflows/chollo-radar-bot.yml"
  pull_request:
    paths:
      - "bot/**"
      - ".github/workflows/chollo-radar-bot.yml"
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chollo-radar-bot
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'schedule' || vars.CHOLLO_RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/pyproject.toml
      - name: Instalar
        run: python -m pip install --disable-pip-version-check .
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Probar un ciclo aislado
        env:
          BOT_SOURCE: demo
          DRY_RUN: "true"
          DATABASE_PATH: "${{ runner.temp }}/chollo-radar-ci.db"
        run: |
          cp config.example.json config.json
          chollo-radar check-config
          chollo-radar once

  automate:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.CHOLLO_RADAR_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chollo-radar-production
    defaults:
      run:
        working-directory: bot
    env:
      BOT_SOURCE: amazon
      DRY_RUN: "${{ vars.CHOLLO_RADAR_DRY_RUN || 'true' }}"
      SUPABASE_URL: "https://jokkwdhlvbkwegcuezyi.supabase.co"
      SUPABASE_SECRET_KEY: "${{ secrets.SUPABASE_SECRET_KEY }}"
      TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
      TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
      AMAZON_CLIENT_ID: "${{ secrets.AMAZON_CLIENT_ID }}"
      AMAZON_CLIENT_SECRET: "${{ secrets.AMAZON_CLIENT_SECRET }}"
      AMAZON_PARTNER_TAG: "${{ secrets.AMAZON_PARTNER_TAG }}"
      AMAZON_CREDENTIAL_VERSION: "3.2"
      AMAZON_MARKETPLACE: "www.amazon.es"
      AMAZON_REQUEST_DELAY_SECONDS: "1.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/pyproject.toml
      - name: Instalar
        run: python -m pip install --disable-pip-version-check .
      - name: Ejecutar un ciclo
        run: |
          cp config.example.json config.json
          chollo-radar check-config
          chollo-radar once

